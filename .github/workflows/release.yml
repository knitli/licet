# T049 — cross-platform release wiring.
# On a pushed `vX.Y.Z` tag: generate release notes with git-cliff, cut a GitHub Release,
# then build a single self-contained binary per target and upload it (with SHA-256
# checksums). Linux uses musl for fully static binaries; aarch64 targets cross-compile.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          fetch-depth: 0 # full history so git-cliff can build the changelog

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@4d0efd7c7a4b55484abf71c29a29712192adebdb
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          # Tags like v1.2.3-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      # Builds `licet` for the target (installing the toolchain / cross-linker as
      # needed), archives it as tar.gz (zip on Windows), emits a .sha256, and uploads
      # everything to the release created above.
      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@dd5bbe0528f32a483b749797277ab6ef83a29999
        with:
          bin: licet
          target: ${{ matrix.target }}
          archive: licet-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
