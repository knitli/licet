# T049 — cross-platform release wiring.
# On a pushed `vX.Y.Z` tag: generate release notes with git-cliff, cut a GitHub Release,
# then build a single self-contained binary per target and upload it (with SHA-256
# checksums). Linux uses musl for fully static binaries; aarch64 targets cross-compile.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  # Fail the whole release before anything is cut or published if the manifest version
  # doesn't match the tag. crates.io versions are immutable, so we keep git as the single
  # source of truth and refuse to "align" in CI (that would publish a crate whose source
  # disagrees with the tagged commit, and break --locked). A mismatch means: bump
  # Cargo.toml + Cargo.lock, delete the bad tag, and re-tag.
  version-guard:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
      - name: Assert Cargo.toml version == tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version[[:space:]]*=' Cargo.toml \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "tag=$tag  manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest — bump Cargo.toml + Cargo.lock and re-tag"
            exit 1
          fi
          echo "ok: Cargo.toml version matches tag"

  create-release:
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
        with:
          fetch-depth: 0 # full history so git-cliff can build the changelog

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@4d0efd7c7a4b55484abf71c29a29712192adebdb
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          # Tags like v1.2.3-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22

      # Builds `licet` for the target (installing the toolchain / cross-linker as
      # needed), archives it as tar.gz (zip on Windows), emits a .sha256, and uploads
      # everything to the release created above.
      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@dd5bbe0528f32a483b749797277ab6ef83a29999
        with:
          bin: licet
          target: ${{ matrix.target }}
          archive: licet-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # crates.io hosts a single source `.crate` (not per-target binaries), so this is one
  # job that runs once. crates.io versions are permanent and immutable, so we hold the
  # publish until the whole binary matrix is green — a build that breaks on any target
  # must not leave a permanent crate release behind. (`cargo publish` also runs its own
  # x86_64 verification build before upload as a final gate.)
  publish-crate:
    environment: cargo
    name: publish to crates.io
    needs: [create-release, upload-assets]
    # crates.io versions are permanent and immutable (yank-only), so publish stable tags
    # only. Pre-release tags (vX.Y.Z-rc.N) still cut a GitHub Release + binaries above.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@baf1a810e98b6a3001d0d7234864ed75a17c42fb

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
