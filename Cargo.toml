[package]
name = "licet"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Declarative, SPDX/REUSE-compatible license-header management"
license = "MIT OR Apache-2.0"

[lib]
name = "licet"
path = "src/lib.rs"

[[bin]]
name = "licet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ignore = "0.4"
rayon = "1"
spdx = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
gix = { version = "0.66", default-features = false, features = ["max-performance-safe", "revision", "status", "dirwalk"] }
memchr = "2"
bstr = "1"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
insta = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "scan"
harness = false

[profile.release]
opt-level = 3
lto = "thin"

# clippy lints: deny warnings in CI via `cargo clippy -- -D warnings`
[lints.clippy]
all = "warn"
