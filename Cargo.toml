[package]
name = "licet"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
description = "Declarative, SPDX/REUSE-compatible license-header management"
readme = "README.md"
homepage = "https://github.com/knitli/licet"
repository = "https://github.com/knitli/licet"
license = "MIT OR Apache-2.0"
keywords = ["cli", "copyright", "license", "reuse", "spdx"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "licet"
path = "src/lib.rs"

[[bin]]
name = "licet"
path = "src/main.rs"

[[bench]]
harness = false
name = "scan"

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.103"
bstr = "1.12.3"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
globset = "0.4.18"
ignore = "0.4.26"
memchr = "2.8.2"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.104"
sha2 = "0.11.0"
smallvec = "1.15.2"
smol_str = "0.3.6"
spdx = "0.13.4"
thiserror = "2.0.18"
toml = "1.1.2"

[dependencies.gix]
version = "0.85.0"
default-features = false
features = ["dirwalk", "max-performance-safe", "revision", "sha1", "status"]

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
insta = "1.48.0"
predicates = "3.1.4"
tempfile = "3.27.0"

# clippy lints: deny warnings in CI via `cargo clippy -- -D warnings`
[lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
