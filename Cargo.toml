[package]
name = "licet"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Declarative, SPDX/REUSE-compatible license-header management"
license = "MIT OR Apache-2.0"

[lib]
name = "licet"
path = "src/lib.rs"

[[bin]]
name = "licet"
path = "src/main.rs"

[[bench]]
harness = false
name = "scan"

[dependencies]
anyhow = "1.0.102"
bstr = "1.12.2"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
gix = {
  version = "0.66",
  default-features = false,
  features = ["dirwalk", "max-performance-safe", "revision", "status"]
}
globset = "0.4"
ignore = "0.4"
memchr = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spdx = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"
insta = "1"
predicates = "3"
tempfile = "3"

# clippy lints: deny warnings in CI via `cargo clippy -- -D warnings`
[lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
